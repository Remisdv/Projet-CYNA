name: Auto Create PR on First Push

on:
  push:
    branches-ignore:
      - 'main'
      - 'master'
      - 'develop'
      - 'production'

jobs:
  auto-create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if PR already exists
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Vérifie si une PR existe déjà pour cette branche
          PR_COUNT=$(gh pr list --head "${{ github.ref_name }}" --json number --jq length)
          if [ "$PR_COUNT" -gt 0 ]; then
            echo "PR already exists. Skipping creation."
            echo "pr_exists=true" >> $GITHUB_OUTPUT
          else
            echo "No PR found. Proceeding to creation."
            echo "pr_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract Linear ID from branch name
        if: steps.check-pr.outputs.pr_exists == 'false'
        id: linear-id
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          LINEAR_ID=$(echo "$BRANCH_NAME" | grep -oP '[A-Z]+-\d+' | head -1 || echo "")
          echo "linear_id=$LINEAR_ID" >> $GITHUB_OUTPUT

      - name: Get branch info
        if: steps.check-pr.outputs.pr_exists == 'false'
        id: branch-info
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          CLEAN_NAME=$(echo "$BRANCH_NAME" | sed 's/feature\///g' | sed 's/bugfix\///g' | sed 's/[-_]/ /g')
          TITLE=$(echo "$CLEAN_NAME" | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) tolower(substr($i,2))}1')
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Create Draft Pull Request
        if: steps.check-pr.outputs.pr_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          # Trouve la branche par défaut dynamiquement
          DEFAULT_BRANCH=$(git remote show origin | grep 'HEAD branch' | cut -d' ' -f5)
          LINEAR_ID="${{ steps.linear-id.outputs.linear_id }}"
          TITLE="${{ steps.branch-info.outputs.title }}"
          
          if [ -n "$LINEAR_ID" ]; then
            PR_TITLE="$LINEAR_ID: $TITLE"
          else
            PR_TITLE="$TITLE"
          fi
          
          ISSUE_NUM=$(echo "$BRANCH_NAME" | grep -oE '^[0-9]+' || echo "")
          LINK_TEXT=""
          if [ -n "$ISSUE_NUM" ]; then
             LINK_TEXT="Closes #$ISSUE_NUM"
          fi

          PR_BODY="🤖 **Cette PR a été créée automatiquement**
          
          Branche : \`$BRANCH_NAME\`
          Base : \`$DEFAULT_BRANCH\`
          
          $LINK_TEXT
          "
          
          echo "Création de la PR..."
          gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --base "$DEFAULT_BRANCH" \
            --head "$BRANCH_NAME" \
            --draft
