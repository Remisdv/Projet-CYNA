name: Auto Create PR on First Push

on:
  push:
    branches-ignore:
      - 'main'
      - 'master'
      - 'develop'
      - 'production'

jobs:
  check-pr-exists:
    runs-on: ubuntu-latest
    outputs:
      pr_exists: ${{ steps.check.outputs.pr_exists }}
    steps:
      - name: Check if PR exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use GH CLI to check for existing PRs without checking out the code
          # We need to specify the repo context since we don't have a git folder
          PR_COUNT=$(gh pr list --head "${{ github.ref_name }}" -R "${{ github.repository }}" --json number --jq length)
          
          if [ "$PR_COUNT" -gt 0 ]; then
            echo "PR already exists for ${{ github.ref_name }}"
            echo "pr_exists=true" >> $GITHUB_OUTPUT
          else
            echo "No PR found for ${{ github.ref_name }}"
            echo "pr_exists=false" >> $GITHUB_OUTPUT
          fi

  create-pr:
    needs: check-pr-exists
    if: needs.check-pr-exists.outputs.pr_exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Linear ID from branch name
        id: linear-id
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          LINEAR_ID=$(echo "$BRANCH_NAME" | grep -oP '[A-Z]+-\d+' | head -1 || echo "")
          echo "linear_id=$LINEAR_ID" >> $GITHUB_OUTPUT

      - name: Check for changes
        id: check-changes
        run: |
          # Trouve la branche par défaut dynamiquement
          DEFAULT_BRANCH=$(git remote show origin | grep 'HEAD branch' | cut -d' ' -f5)
          echo "default_branch=$DEFAULT_BRANCH" >> $GITHUB_OUTPUT
          
          # Vérifie s'il y a des différences/commits
          CHANGE_COUNT=$(git rev-list --count origin/$DEFAULT_BRANCH..${{ github.ref_name }})
          
          if [ "$CHANGE_COUNT" -eq 0 ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected (branch is equal to $DEFAULT_BRANCH). Skipping PR creation."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected ($CHANGE_COUNT commits)."
          fi

      - name: Get branch info
        if: steps.check-changes.outputs.has_changes == 'true'
        id: branch-info
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          CLEAN_NAME=$(echo "$BRANCH_NAME" | sed 's/feature\///g' | sed 's/bugfix\///g' | sed 's/[-_]/ /g')
          TITLE=$(echo "$CLEAN_NAME" | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) tolower(substr($i,2))}1')
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Create Draft Pull Request
        if: steps.check-changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          DEFAULT_BRANCH="${{ steps.check-changes.outputs.default_branch }}"
          LINEAR_ID="${{ steps.linear-id.outputs.linear_id }}"
          TITLE="${{ steps.branch-info.outputs.title }}"
          
          if [ -n "$LINEAR_ID" ]; then
            PR_TITLE="$LINEAR_ID: $TITLE"
          else
            PR_TITLE="$TITLE"
          fi
          
          ISSUE_NUM=$(echo "$BRANCH_NAME" | grep -oE '^[0-9]+' || echo "")
          LINK_TEXT=""
          if [ -n "$ISSUE_NUM" ]; then
             LINK_TEXT="Closes #$ISSUE_NUM"
          fi

          PR_BODY="**Cette PR a été créée automatiquement**
          
          Branche : \`$BRANCH_NAME\`
          Base : \`$DEFAULT_BRANCH\`
          
          $LINK_TEXT
          "
          
          echo "Création de la PR..."
          gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --base "$DEFAULT_BRANCH" \
            --head "$BRANCH_NAME" \
            --draft \
            --assignee "${{ github.actor }}"
