name: cyna-it

services:
  # ============================================
  # DATABASES
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: cyna-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cyna-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: cyna-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - cyna-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================
  # MAIL SERVER (Dev)
  # ============================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: cyna-mailhog
    ports:
      - "${SMTP_PORT}:1025"
      - "8025:8025"
    networks:
      - cyna-network

  # ============================================
  # BACKEND APIs (NestJS with Hot Reload)
  # ============================================
  cyna-gateway-api:
    build:
      context: ../../
      dockerfile: docker/dev/Dockerfile.nestjs
      args:
        APP_NAME: service/api/cyna-gateway-api
    container_name: cyna-gateway-api
    ports:
      - "${GATEWAY_API_PORT}:3000"
    volumes:
      - ../../service/api/cyna-gateway-api:/app
      - /app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - BO_API_URL=${BO_API_URL}
      - WEBAPP_API_URL=${WEBAPP_API_URL}
      - SERVICE_API_URL=${SERVICE_API_URL}
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - cyna-network

  cyna-bo-api:
    build:
      context: ../../
      dockerfile: docker/dev/Dockerfile.nestjs
      args:
        APP_NAME: service/api/cyna-bo-api
    container_name: cyna-bo-api
    ports:
      - "${BO_API_PORT}:3000"
    volumes:
      - ../../service/api/cyna-bo-api:/app
      - /app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - cyna-network

  cyna-webapp-api:
    build:
      context: ../../
      dockerfile: docker/dev/Dockerfile.nestjs
      args:
        APP_NAME: service/api/cyna-webapp-api
    container_name: cyna-webapp-api
    ports:
      - "${WEBAPP_API_PORT}:3000"
    volumes:
      - ../../service/api/cyna-webapp-api:/app
      - /app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - cyna-network

  cyna-service-api:
    build:
      context: ../../
      dockerfile: docker/dev/Dockerfile.nestjs
      args:
        APP_NAME: service/api/cyna-service-api
    container_name: cyna-service-api
    ports:
      - "${SERVICE_API_PORT}:3000"
    volumes:
      - ../../service/api/cyna-service-api:/app
      - /app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - cyna-network

  # ============================================
  # FRONTEND - Back Office
  # ============================================
  cyna-bo-front:
    build:
      context: ../../
      dockerfile: docker/dev/Dockerfile.react
      args:
        APP_PATH: service/front/back-office
    container_name: cyna-bo-front
    ports:
      - "${BO_FRONT_PORT}:5173"
    volumes:
      - ../../service/front/back-office:/app
      - /app/node_modules
    environment:
      # Vite expose les variables commençant par VITE_
      # L'URL doit pointer vers le port mappé de la machine hôte (pas l'interne docker)
      # car le code s'exécute dans le navigateur
      - VITE_API_URL=http://localhost:${GATEWAY_API_PORT}
    networks:
      - cyna-network

networks:
  cyna-network:
    driver: bridge

volumes:
  postgres_data:
  elasticsearch_data:
