name: cyna-it

services:
  # ============================================
  # DATABASES
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: cyna-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cyna-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: cyna-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - cyna-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================
  # MAIL SERVER (Dev)
  # ============================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: cyna-mailhog
    ports:
      - "${SMTP_PORT}:1025"
      - "8025:8025"
    networks:
      - cyna-network

  # ============================================
  # REVERSE PROXY
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: cyna-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - cyna-gateway-api
      - cyna-bo-front
      - cyna-webapp-front
    networks:
      - cyna-network

  # ============================================
  # BACKEND APIs (NestJS with Hot Reload)
  # ============================================
  cyna-gateway-api:
    build:
      context: ../../
      dockerfile: docker/dev/Dockerfile.nestjs
      args:
        APP_NAME: service/api/cyna-gateway-api
    container_name: cyna-gateway-api
    volumes:
      - ../../service/api/cyna-gateway-api:/app
      - /app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - BO_API_URL=${BO_API_URL}
      - BO_API_HOST=cyna-bo-api
      - BO_API_PORT=3000
      - WEBAPP_API_URL=${WEBAPP_API_URL}
      - SERVICE_API_URL=${SERVICE_API_URL}
      # Middlewares & Guards
      - JWT_SECRET=${JWT_SECRET}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_COLORS=${LOG_COLORS}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS}
      - COMPRESSION_ENABLED=${COMPRESSION_ENABLED}
      - COMPRESSION_THRESHOLD=${COMPRESSION_THRESHOLD}
      - CSP_POLICY=${CSP_POLICY}
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - cyna-network

  cyna-bo-api:
    build:
      context: ../../
      dockerfile: docker/dev/Dockerfile.nestjs
      args:
        APP_NAME: service/api/cyna-bo-api
    container_name: cyna-bo-api
    volumes:
      - ../../service/api/cyna-bo-api:/app
      - /app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_OPTIONS=--max-old-space-size=512
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - cyna-network

  cyna-webapp-api:
    build:
      context: ../../
      dockerfile: docker/dev/Dockerfile.nestjs
      args:
        APP_NAME: service/api/cyna-webapp-api
    container_name: cyna-webapp-api
    volumes:
      - ../../service/api/cyna-webapp-api:/app
      - /app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - EMAIL_CONTACT_DEST=${EMAIL_CONTACT_DEST}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - SERVICE_API_URL=http://cyna-service-api:3000
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - cyna-network

  cyna-service-api:
    build:
      context: ../../
      dockerfile: docker/dev/Dockerfile.nestjs
      args:
        APP_NAME: service/api/cyna-service-api
    container_name: cyna-service-api
    volumes:
      - ../../service/api/cyna-service-api:/app
      - /app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - cyna-network

  # ============================================
  # FRONTEND - WebApp
  # ============================================
  cyna-webapp-front:
    build:
      context: ../../
      dockerfile: docker/dev/Dockerfile.react
      args:
        APP_PATH: service/front/webapp
    container_name: cyna-webapp-front
    volumes:
      - ../../service/front/webapp:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://api.localhost
      - VITE_STRIPE_PK=${STRIPE_PUBLISHABLE_KEY}
    networks:
      - cyna-network

  # ============================================
  # FRONTEND - Back Office
  # ============================================
  cyna-bo-front:
    build:
      context: ../../
      dockerfile: docker/dev/Dockerfile.react
      args:
        APP_PATH: service/front/back-office
    container_name: cyna-bo-front
    volumes:
      - ../../service/front/back-office:/app
      - /app/node_modules
    environment:
      # Vite expose les variables commençant par VITE_
      # L'URL doit être accessible depuis le navigateur (pas l'interne docker)
      # Le navigateur appelle api.localhost → nginx → cyna-gateway-api:3000
      - VITE_API_URL=http://api.localhost
    networks:
      - cyna-network

networks:
  cyna-network:
    driver: bridge

volumes:
  postgres_data:
  elasticsearch_data:
