events {
    worker_connections 1024;
}

http {
    # Docker DNS resolver – re-resolve on each request so nginx
    # picks up new container IPs after docker-compose rebuild
    resolver 127.0.0.11 valid=5s;
    resolver_timeout 5s;

    # ── Back Office Frontend ─────────────────────────────────────
    server {
        listen 80;
        server_name bo.localhost;

        location / {
            set $bo_front "http://cyna-bo-front:5173";
            proxy_pass $bo_front;
            proxy_http_version 1.1;
            # WebSocket pour Vite HMR (hot reload)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            # Prevent nginx from killing the HMR WebSocket after 60s
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    # ── API Gateway (seul point d'entrée externe) ────────────────
    server {
        listen 80;
        server_name api.localhost;

        location / {
            set $gateway "http://cyna-gateway-api:3000";
            proxy_pass $gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── WebApp Frontend ──────────────────────────────────────────
    server {
        listen 80 default_server;
        server_name localhost;

        # Route API calls directly to gateway (bypass Vite proxy)
        location /api/ {
            set $gateway "http://cyna-gateway-api:3000";
            proxy_pass $gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Serve uploaded images from gateway
        location /uploads/ {
            set $gateway "http://cyna-gateway-api:3000";
            proxy_pass $gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location / {
            set $webapp_front "http://cyna-webapp-front:5174";
            proxy_pass $webapp_front;
            proxy_http_version 1.1;
            # WebSocket pour Vite HMR (hot reload)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            # Prevent nginx from killing the HMR WebSocket after 60s
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
