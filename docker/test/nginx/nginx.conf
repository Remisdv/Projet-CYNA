events {
    worker_connections 1024;
}

http {
    # ── Back Office Frontend ─────────────────────────────────────
    server {
        listen 80;
        server_name bo.localhost;

        location / {
            proxy_pass http://cyna-test-bo-front:5173;
            proxy_http_version 1.1;
            # WebSocket pour Vite HMR (hot reload)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ── API Gateway (seul point d'entrée externe) ────────────────
    server {
        listen 80;
        server_name api.localhost;

        location / {
            proxy_pass http://cyna-test-gateway-api:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── WebApp Frontend ──────────────────────────────────────────
    server {
        listen 80 default_server;
        server_name localhost;

        location / {
            proxy_pass http://cyna-test-webapp-front:5174;
            proxy_http_version 1.1;
            # WebSocket pour Vite HMR (hot reload)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
