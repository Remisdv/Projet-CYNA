name: cyna-test

services:
  # ============================================
  # DATABASE
  # ============================================
  cyna-test-postgres:
    image: postgres:16-alpine
    container_name: cyna-test-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - cyna-test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # BACKEND APIs (NestJS Test)
  # ============================================
  cyna-test-gateway-api:
    build:
      context: ../../
      dockerfile: docker/test/Dockerfile.nestjs
      args:
        APP_NAME: service/api/cyna-gateway-api
    container_name: cyna-test-gateway-api
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL}
      - SMTP_HOST=localhost
      - SMTP_PORT=1025
      - BO_API_URL=${BO_API_URL}
      - BO_API_HOST=cyna-test-bo-api
      - BO_API_PORT=3000
      - WEBAPP_API_URL=${WEBAPP_API_URL}
      - SERVICE_API_URL=${SERVICE_API_URL}
      - JWT_SECRET=${JWT_SECRET}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_COLORS=${LOG_COLORS}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS}
      - COMPRESSION_ENABLED=${COMPRESSION_ENABLED}
      - COMPRESSION_THRESHOLD=${COMPRESSION_THRESHOLD}
      - CSP_POLICY=${CSP_POLICY}
    depends_on:
      cyna-test-postgres:
        condition: service_healthy
    networks:
      - cyna-test-network

  cyna-test-bo-api:
    build:
      context: ../../
      dockerfile: docker/test/Dockerfile.nestjs
      args:
        APP_NAME: service/api/cyna-bo-api
    container_name: cyna-test-bo-api
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL}
      - SMTP_HOST=localhost
      - SMTP_PORT=1025
      - JWT_SECRET=${JWT_SECRET}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_COLORS=${LOG_COLORS}
      - NODE_OPTIONS=--max-old-space-size=512
    depends_on:
      cyna-test-postgres:
        condition: service_healthy
    networks:
      - cyna-test-network

  cyna-test-webapp-api:
    build:
      context: ../../
      dockerfile: docker/test/Dockerfile.nestjs
      args:
        APP_NAME: service/api/cyna-webapp-api
    container_name: cyna-test-webapp-api
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL}
      - SMTP_HOST=localhost
      - SMTP_PORT=1025
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_COLORS=${LOG_COLORS}
    depends_on:
      cyna-test-postgres:
        condition: service_healthy
    networks:
      - cyna-test-network

  cyna-test-service-api:
    build:
      context: ../../
      dockerfile: docker/test/Dockerfile.nestjs
      args:
        APP_NAME: service/api/cyna-service-api
    container_name: cyna-test-service-api
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL}
      - SMTP_HOST=localhost
      - SMTP_PORT=1025
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_COLORS=${LOG_COLORS}
    depends_on:
      cyna-test-postgres:
        condition: service_healthy
    networks:
      - cyna-test-network

networks:
  cyna-test-network:
    driver: bridge

volumes:
  postgres_test_data:
